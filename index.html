<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhasebe</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muhasebe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html,body{margin:0;min-height:100%;background:#1F3864;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .w{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 24px;box-sizing:border-box;text-align:center}
  img{width:104px;height:104px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{margin:0;font-size:20px}
  p{margin:0;opacity:.8;font-size:14px;max-width:330px;line-height:1.5}
  .kutu{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;max-width:330px;text-align:left;font-size:14px;line-height:1.55}
  .kutu b{color:#F2B705}
  a.btn{display:inline-block;margin-top:4px;background:#F2B705;color:#1F3864;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:12px}
  .hide{display:none}
</style>
</head>
<body>
<div class="w">
  <img src="icon-512.png" alt="">
  <h1>Miraç Cep Otomat · Muhasebe</h1>
  <p id="msg">Açılıyor…</p>
  <div class="kutu hide" id="ios">Telefona eklemek için:<br>1. Alttaki <b>Paylaş</b> düğmesine dokunun (kare ve yukarı ok)<br>2. <b>Ana Ekrana Ekle</b>'yi seçin<br>3. Sağ üstte <b>Ekle</b> deyin</div>
  <div class="kutu hide" id="android">Telefona eklemek için:<br>1. Sağ üstteki <b>⋮</b> menüsüne dokunun<br>2. <b>Ana ekrana ekle</b>'yi seçin<br>3. <b>Ekle</b> deyin</div>
  <a class="btn hide" id="git" href="#">Uygulamayı Aç</a>
</div>
<script>
  var UYGULAMA = 'https://script.google.com/macros/s/AKfycbzchK7M1G1ou63jdbV8Y3uMuCCMTxOgadY4n1q3JvTawG_EuPZohuJCPnnFJYurzjBi/exec';

  // Ana ekrandaki simgeden mi açıldı?
  var anaEkran = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    location.search.indexOf('app=1') >= 0;
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var android = /Android/.test(ua);

  var a = document.getElementById('git');
  a.href = UYGULAMA;
  if (anaEkran) {
    // Simgeden açıldı: doğrudan uygulamaya geç
    location.replace(UYGULAMA);
  } else {
    // Tarayıcıda açıldı: önce ana ekrana eklensin diye bekle
    document.getElementById('msg').textContent = 'Bu sayfayı telefonunuzun ana ekranına ekleyin, sonra uygulamayı oradaki simgeden açın.';
    if (ios) document.getElementById('ios').classList.remove('hide');
    else if (android) document.getElementById('android').classList.remove('hide');
    a.classList.remove('hide');
  }
</script>
</body>
</html>
